 else if(type==="suites"){let v=value(n)||{};for(let j=1;j<=3;j++){h+='<label style="display:block;margin-bottom:12px"><span class="fieldname">Suíte '+String(j).padStart(2,"0")+'</span><select class="field" onchange="complex('+n+',\'suite'+j+'\',this.value)"><option value="">Selecione</option>'+["Casal","Hóspedes","Familiar","Outra utilização"].map(x=>'<option '+(v["suite"+j]===x?"selected":"")+'>'+safe(x)+'</option>').join("")+'</select></label>'}}

 }else if(step===SECTIONS.length){

 for(const s of SECTIONS){h+='<details class="review"><summary>'+safe(s[0])+'</summary><div class="review-body">';for(const q of s[2]){let v=value(q[0]);let out=Array.isArray(v)?v.join("; "):typeof v==="object"&&v?Object.entries(v).filter(([k,x])=>x).map(([k,x])=>k+": "+x).join(" | "):v;h+='<div class="review-question"><b>'+q[0]+'. '+safe(q[2])+'</b><span>'+safe(out||"Não informado")+'</span></div>'}h+='</div></details>'}
 h+='<div class="notice privacy-notice"><strong>Privacidade e proteção de dados · LGPD</strong><p>Os profissionais autônomos responsáveis pela marca VA Arquitetura e Interiores utilizarão as informações fornecidas exclusivamente para conhecer seu perfil, compreender suas necessidades e desenvolver o projeto de arquitetura e interiores. Não comercializamos os dados pessoais.</p><p>Para encaminhar o formulário ao escritório, as respostas serão processadas pelo serviço <strong>FormSubmit.co</strong> e enviadas à conta Gmail do escritório (<strong>vidart.arquitetura@gmail.com</strong>), envolvendo esses prestadores tecnológicos. Solicitações sobre acesso, correção, informações de tratamento e exclusão, conforme aplicável à Lei 13.709/2018, podem ser feitas a <a href="mailto:vidart.arquitetura@gmail.com">vidart.arquitetura@gmail.com</a>.</p><p>As respostas sobre mobilidade, visão, audição e adaptações específicas são opcionais. Não é necessário compartilhar diagnósticos. Para conhecer os detalhes do serviço usado no envio, consulte <a href="https://formsubmit.co/" target="_blank" rel="noopener noreferrer">FormSubmit.co</a>.</p><label class="choice"><input id="privacy" type="checkbox"><span>Declaro que li e estou ciente do aviso de privacidade e do envio dos dados para o escritório.</span></label><label class="choice" style="margin-top:10px"><input id="sensitive" type="checkbox"><span>Se forneci informações sobre mobilidade, visão, audição ou outras necessidades relacionadas à saúde, autorizo o tratamento desses dados para adequar meu projeto.</span></label></div><p class="status" id="status" role="status" aria-live="polite"></p><div class="actions"><button class="btn secondary" onclick="go(11)">Voltar às perguntas</button><button id="submit" class="btn" onclick="send()">Enviar meu briefing</button></div></section>';

 root.innerHTML=h;document.body.classList.toggle("is-welcome",step===-1);document.getElementById("stepText").textContent=step<0?"Boas-vindas":step===12?"Revisão":step>12?"Finalizado":(step+1)+" / 12";

async function send(){
 const status=document.getElementById("status"),btn=document.getElementById("submit");
 if(!contact.name.trim()){status.textContent="Por favor, informe seu nome.";document.getElementById("contactName").focus();return}
 if(contact.email&&!document.getElementById("contactEmail").checkValidity()){status.textContent="Verifique o e-mail informado.";return}
 if(!document.getElementById("privacy").checked){status.textContent="Leia e confirme o aviso de privacidade.";return}
 const hasSensitive=[14,15,18].some(n=>{const v=value(n);return Array.isArray(v)?v.some(x=>!x.includes("Prefiro")):!!v&&v!=="Prefiro conversar pessoalmente"});
 if(hasSensitive&&!document.getElementById("sensitive").checked){status.textContent="Marque a autorização específica para o tratamento das respostas sobre acessibilidade ou deixe essas respostas em branco.";return}
 const form=new FormData();form.append("_subject","VA — Briefing de Interiores — "+contact.name);form.append("_template","table");form.append("_captcha","false");form.append("Nome",contact.name);form.append("E-mail do cliente",contact.email||"Não informado");form.append("Cidade",contact.city||"Não informada");
 for(const s of SECTIONS){for(const q of s[2]){let v=value(q[0]);let out=Array.isArray(v)?v.join("; "):typeof v==="object"&&v?Object.entries(v).map(([k,x])=>k+": "+x).join(" | "):String(v||"Não informado");form.append(String(q[0]).padStart(2,"0")+" | "+q[2],out)}}
 form.append("Ciência do aviso LGPD","Sim");form.append("Autorização específica para dados de acessibilidade",document.getElementById("sensitive").checked?"Sim":"Não aplicável");btn.disabled=true;btn.textContent="Enviando…";status.textContent="Conectando ao serviço de envio…";
 try{const res=await fetch("https://formsubmit.co/ajax/vidart.arquitetura@gmail.com",{method:"POST",body:form,headers:{Accept:"application/json"}});let data={};try{data=await res.json()}catch(e){}if(!res.ok||data.success===false||data.success==="false")throw new Error(data.message||"Serviço indisponível");go(13)}catch(err){status.textContent="Não foi possível confirmar o envio. Verifique a conexão e tente novamente. "+String(err.message||"");btn.disabled=false;btn.textContent="Tentar enviar novamente"}
}
render();</script></body></html>
